name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── yorvolabs/canary (core) ─────────────────────────────────────────────────────
  canary:
    name: canary / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/YorvoLabs/Canary
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache, pcntl, sockets
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: CS check
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  canary-coverage:
    name: canary / coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/YorvoLabs/Canary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: opcache, pcntl, sockets
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - uses: codecov/codecov-action@v4
        with:
          files: src/YorvoLabs/Canary/coverage.xml
          fail_ci_if_error: false

  # ── yorvolabs/canary-bridge-shopware ────────────────────────────────────────────
  bridge-shopware:
    name: bridge-shopware / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/YorvoLabs/Bridge/Shopware
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache, pcntl, sockets
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: CS check
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Unit + Functional tests
        run: vendor/bin/phpunit --testsuite Unit,Functional

  # Integration tests require a running Shopware installation.
  # They are NOT part of the standard CI matrix — run them locally with:
  #   make up-shopware && make test-integration
