name: Split

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  split:
    runs-on: ubuntu-latest
    # Serialise runs per split repo so a later push can't race the verification step
    concurrency:
      group: split-${{ matrix.package.split_repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: 'src/YorvoLabs/Canary'
            split_repository: 'canary'
          - local_path: 'src/YorvoLabs/Bridge/Shopware'
            split_repository: 'canary-bridge-shopware'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The bridge keeps a "version" field (required for Shopware Store / zip installs).
      # Packagist skips tags that don't match it, so refuse to publish a mismatched tag.
      - name: Verify bridge version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(jq -r '.version' src/YorvoLabs/Bridge/Shopware/composer.json)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match bridge composer.json version '${version}'. Bump the version before tagging."
            exit 1
          fi

      - name: Strip dev path repository from bridge composer.json
        if: matrix.package.local_path == 'src/YorvoLabs/Bridge/Shopware'
        run: |
          jq 'del(.repositories)' src/YorvoLabs/Bridge/Shopware/composer.json \
            > /tmp/composer.tmp && mv /tmp/composer.tmp src/YorvoLabs/Bridge/Shopware/composer.json

      # Push to main → split branch only
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_MONOREPO_TOKEN }}
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: 'yorvolabs'
          repository_name: ${{ matrix.package.split_repository }}
          branch: 'main'
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # Tag push → split branch and propagate the tag (Packagist reads versions from split repo tags)
      - if: startsWith(github.ref, 'refs/tags/')
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_MONOREPO_TOKEN }}
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: 'yorvolabs'
          repository_name: ${{ matrix.package.split_repository }}
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      # The split action ignores git errors (bad token, rejected push) and still exits 0,
      # so compare what actually landed in the split repo with the package directory.
      - name: Verify split repository received the package
        env:
          TOKEN: ${{ secrets.SPLIT_MONOREPO_TOKEN }}
          REPO: yorvolabs/${{ matrix.package.split_repository }}
          PACKAGE_DIR: ${{ matrix.package.local_path }}
          REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
        run: |
          if ! git clone --quiet --depth 1 --branch "$REF" "https://x-access-token:${TOKEN}@github.com/${REPO}.git" /tmp/split-check; then
            echo "::error::Could not clone ${REPO}@${REF}. Check that SPLIT_MONOREPO_TOKEN has Contents: Read and write on ${REPO}."
            exit 1
          fi
          if ! diff -r --exclude=.git "$PACKAGE_DIR" /tmp/split-check; then
            echo "::error::${REPO}@${REF} does not match ${PACKAGE_DIR}. The split push did not land — check the split step log above."
            exit 1
          fi
          echo "${REPO}@${REF} matches ${PACKAGE_DIR}"
