; Active only when xdebug is loaded (build arg XDEBUG=true).
; PHP silently ignores unknown ini keys, so this file is always safe to include.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.log=/tmp/xdebug.log
xdebug.idekey=PHPSTORM
