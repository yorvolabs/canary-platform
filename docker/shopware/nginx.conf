server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;

    # Shopware 6 front-controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front-controller PHP file is accessible from outside.
    # All other .php files return 404 to prevent direct execution.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Static assets — long cache, no PHP
    location ~* \.(ico|css|js|gif|jpg|jpeg|png|svg|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
